<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Desk Tracker</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="bar">
    <div id="clock"><span id="time"></span><span id="date"></span></div>
    <nav id="tabs" aria-label="Scenes"></nav>
    <div id="status"><span id="status-dot"></span><span id="status-text">Starting</span></div>
  </header>

  <main id="stage">
    <section class="scene" id="scene-map">
      <div id="map"></div>
      <aside id="board">
        <h2>Overhead</h2>
        <ol id="board-list"></ol>
      </aside>
    </section>

    <section class="scene pane" id="scene-calendar">
      <div id="cal-body"></div>
    </section>

    <section class="scene pane" id="scene-stocks">
      <div id="stocks-body"></div>
    </section>

    <section class="scene pane" id="scene-news">
      <div id="news-body"></div>
    </section>

    <section class="scene pane" id="scene-weather">
      <div id="weather-body"></div>
    </section>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="/map.js"></script>
  <script src="/app.js"></script>
</body>
</html>
